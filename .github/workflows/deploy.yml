name: 构建并部署

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同时只跑一个部署，避免两次 push 撞车
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: 测试与类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装前端依赖
        run: bun install --frozen-lockfile

      - name: 单元测试
        run: bun run test:run

      - name: 前端类型检查
        run: bunx tsc -b --force

      - name: 安装后端依赖
        working-directory: server
        run: bun install --frozen-lockfile

      - name: 后端类型检查
        working-directory: server
        run: bun run typecheck

  deploy:
    name: 部署到服务器
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 前端静态资源 ----------
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建前端
        env:
          # 与后端同域，走 Caddy 的 /api 反代
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          # 房间语音的 STUN/TURN（服务器上的 coturn），JSON 数组
          VITE_ICE_SERVERS: ${{ secrets.VITE_ICE_SERVERS }}
        run: bun run build

      - name: 确认构建产物不含明文凭证
        run: |
          if grep -rqE "ADMIN_PASSWORD|VITE_ADMIN" dist/; then
            echo "::error::构建产物里出现了管理员凭证，中止部署"
            exit 1
          fi
          echo "✅ 构建产物干净"

      # ---------- 分发 ----------
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: 上传前端产物
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/nightwolf/dist/"

      # ---------- 后端源码 → 服务器本地构建 ----------
      # 不走镜像仓库（国内服务器拉境外 registry 不稳，ACR 又要多一套账号）：
      # 把构建上下文（server/ + shared/）rsync 到服务器，deploy.sh 里 docker build。
      - name: 上传后端源码
        run: |
          rsync -az --delete --exclude node_modules \
            -e "ssh -i ~/.ssh/id_ed25519" \
            server shared \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/nightwolf/build/"

      # SSH 密钥被服务器端 ssh-gate.sh 锁死：只放行上面两条 rsync 和这句部署脚本，
      # 即使密钥泄露也开不了 shell。
      - name: 触发服务器部署
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "/srv/nightwolf/deploy.sh"
